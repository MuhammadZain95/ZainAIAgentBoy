name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java installation
        run: |
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          echo "=== java -version ==="
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $JAVA_VER"
          if ! [[ "$JAVA_VER" =~ ^[0-9]+$ ]] || [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java 17 or higher is required. Found version: '$JAVA_VER'"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH. Searching app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty!"
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: APK file does not end in .apk"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Error: gh CLI is not available"
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          echo "Creating release $TAG..."
          gh release create "$TAG" "$APK_FILE#app-debug.apk" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Automated Debug APK Build for commit ${{ github.sha }}" \
            --latest
